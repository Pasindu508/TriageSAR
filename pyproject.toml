[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagesar"
version = "0.1.0"
description = "From NISAR surface motion to an evidence-ranked infrastructure inspection queue"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "h5py>=3.11,<4",
  "rasterio>=1.4,<2",
  "pyproj>=3.6,<4",
  "shapely>=2.1,<3",
  "affine>=2.4,<4",
  "pydantic>=2.7,<3",
  "pillow>=10,<14",
  "requests>=2.31,<3",
  "fsspec>=2024.6",
  "aiohttp>=3.9,<4",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "httpx2", "ruff>=0.5", "mypy>=1.10", "types-requests", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["science", "apps/api"]
include = ["triagesar*", "app*"]

[tool.pytest.ini_options]
testpaths = ["science/tests", "apps/api/tests", "tests"]
pythonpath = ["science", "apps/api", "."]
markers = ["integration: needs network access to NASA/ASF services (skipped unless TRIAGESAR_RUN_INTEGRATION=1)"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["triagesar", "app", "tests", "_common"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["science", "apps/api", "scripts", "."]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
