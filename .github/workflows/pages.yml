name: Publish site (GitHub Pages)

# Builds a static snapshot of TriageSAR from the committed fixtures and publishes it on GitHub Pages.
# Runs on every push to main, so case studies merged from the auto-ingest pull requests go live automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e ".[dev]"  # the exporter uses FastAPI's TestClient
      - run: npm ci
        working-directory: apps/web
      - name: Verify fixtures
        run: python scripts/verify_fixture_hashes.py
      - name: Export the static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python scripts/export_static_site.py --out site --base "${PAGES_BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
